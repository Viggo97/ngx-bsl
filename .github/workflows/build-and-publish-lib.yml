name: Build and Publish Library

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Library and Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Upload Library build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-dist
          path: dist/ngx-bsl
          retention-days: 1

      - name: Build docs
        run: npm run build:docs

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/ngx-bsl-docs/browser/index.html dist/ngx-bsl-docs/browser/404.html

      - name: Upload Docs build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ngx-bsl-docs/browser
          retention-days: 1

  publish-lib:
    name: Publish Library
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lib-dist
          path: dist/ngx-bsl

      - name: Publish to NPM
        run: |
          cd dist/ngx-bsl
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docs:
    name: Publish Docs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
