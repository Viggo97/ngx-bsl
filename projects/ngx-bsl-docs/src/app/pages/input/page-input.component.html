<h2>Input</h2>
<p>Library provides a set of predefined styles for inputs.</p>

<section>
    <h3>Text input</h3>
    <input type="text" style="width:200px">
    <pre><code class="language-xml" [innerHTML]="textInput()"></code></pre>
</section>

<section>
    <h3>Text input</h3>
    <input type="number" style="width:200px">
    <pre><code class="language-xml" [innerHTML]="numberInput()"></code></pre>
</section>
