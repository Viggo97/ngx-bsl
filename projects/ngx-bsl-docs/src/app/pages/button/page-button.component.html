<h2>Button</h2>
<p>Library provides a set of predefined styles for buttons.</p>

<section>
    <h3>Standard button</h3>
    <button style="width: fit-content">Hello world!</button>
    <pre><code class="language-xml" [innerHTML]="standardButton()"></code></pre>
</section>

<section>
    <h3>Icon button</h3>
    <button style="width: fit-content" class="bsl-button-icon">🌍</button>
    <pre><code class="language-xml" [innerHTML]="iconButton()"></code></pre>
</section>

<section>
    <h3>Invisible button</h3>
    <button style="width: fit-content" class="bsl-button-invisible">Hello world!</button>
    <pre><code class="language-xml" [innerHTML]="invisibleButton()"></code></pre>
</section>

<section>
    <h3>Disabled button</h3>
    <button style="width: fit-content" disabled>Hello world!</button>
    <pre><code class="language-xml" [innerHTML]="disabledButton()"></code></pre>
</section>
