<h2>Select</h2>
<p>Combobox enables users choose a value from a dropdown. Options are provided by using ng-content
    with dedicated components such ngx-bsl-list-box-option, ngx-bsl-list-box-group or ngx-bsl-list-box-separator.
    Both value and options can be either string or complex objects.</p>
