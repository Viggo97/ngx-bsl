<h2>Checkbox</h2>
<p>Simple checkbox control. It requires to provide id attribute.</p>

<section>
    <h3>Checkbox</h3>
    <ngx-bsl-checkbox id="simple-checkbox">Label of the checkbox</ngx-bsl-checkbox>
    <pre><code class="language-xml" [innerHTML]="checkbox()"></code></pre>
</section>

<section>
    <h3>Disabled checkbox</h3>
    <p>Disabled state can be set either by [disabled] attribute or by using disable() method in FormControl.</p>
    <ngx-bsl-checkbox id="disabled-checkbox" [disabled]="true">Label of the disabled checkbox</ngx-bsl-checkbox>
    <pre><code class="language-xml" [innerHTML]="disabledCheckbox()"></code></pre>
</section>
