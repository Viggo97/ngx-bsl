<h2>Installation</h2>

<section>
    <p>To install library run the following command in your project:</p>
    <pre><code class="language-typescript" [innerHTML]="installation()"></code></pre>
    <p>Then import library styles into your main style file (typically in root of the project):</p>
    <pre><code class="language-css" [innerHTML]="styles()"></code></pre>
    <p>Library is ready to use.</p>
</section>
